name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'app/frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  REGISTRY: 557496517532.dkr.ecr.us-east-1.amazonaws.com
  REPO: electro_frontend
  IMAGE_TAG: v1.0.${{ github.run_number }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        working-directory: ./app/frontend
        run: |
          docker build -t $REGISTRY/$REPO:$IMAGE_TAG .
          docker push $REGISTRY/$REPO:$IMAGE_TAG

      - name: Get Public IP
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=Test" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text)
          [ -n "$PUBLIC_IP" ] || { echo "No running instance found"; exit 1; }
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin \
              557496517532.dkr.ecr.us-east-1.amazonaws.com

            cd /home/ubuntu

            sed -i "s|image: 557496517532.dkr.ecr.us-east-1.amazonaws.com/electro_frontend:[^ ]*|image: 557496517532.dkr.ecr.us-east-1.amazonaws.com/electro_frontend:v1.0.${{ github.run_number }}|g" docker-compose.yml

            docker compose pull frontend
            docker compose up -d --no-deps --force-recreate frontend
            docker image prune -f
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"