services:
  frontend:
    image: 557496517532.dkr.ecr.us-east-1.amazonaws.com/electro_frontend:v1.0.1
    container_name: electro-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: 557496517532.dkr.ecr.us-east-1.amazonaws.com/electro_backend:v1.0.1
    container_name: electro-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=${RDS_HOSTNAME}
      - DB_USER=dbadmin
      - DB_PASSWORD=${RDS_PASSWORD}
      - DB_NAME=appdb
      - DB_PORT=5432
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network
    restart: unless-stopped